<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>T-Astro</title>
    <script src="index.js" defer></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Lugrasimo&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <canvas id="starfield"></canvas>
    <div class="menu-button">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="side-menu">
      <h2>Menu</h2>
      <ul>
        <li><a href="#">About T-Astro</a></li>
      </ul>
    </div>
    <main class="main-section">
      <h1 class="project-title">T-Astro</h1>
      <div class="zoom-container">
        <div class="solar-system-container">
          <div class="sun-container"></div>
          <div class="planet planet1" data-name="Mercury"></div>
          <div class="planet planet2" data-name="Venus"></div>
          <div class="planet planet3" data-name="Earth"></div>
          <div class="planet planet4" data-name="Mars"></div>
          <div class="planet planet5" data-name="Jupiter"></div>
          <div class="planet planet6" data-name="Saturn"></div>
          <div class="planet planet7" data-name="Uranus"></div>
          <div class="planet planet8" data-name="Neptune"></div>
        </div>
      </div>
      <button class="start-button">Click here😝</button>
      <div id="myModal" class="modal">
        <div class="modal-content">
          <span class="close">&times</span>
          <div class="center-text">
            <h3 id="planetName"></h3>
          </div>
          <p class="modal-content-text">
            <strong>Size:</strong><span id="sizeInfo"></span>
          </p>
          <p class="modal-content-text">
            <strong>Temperature:</strong><span id="tempInfo"></span>
          </p>
          <p class="modal-content-text">
            <strong>Speed of rotation:</strong><spam id="speedInfo"></spam>
          </p>
          <p class="modal-content-text">
            <strong>Distance from the Earth:</strong>
            <spam id="distanceInfo"></spam>
          </p>
          <p class="modal-content-text">
            <strong>Distance from the Sun:</strong>
            <spam id="distanceInfo1"></spam>
          </p>
          <p class="modal-content-text">
            <strong>Additional Information:</strong> <spam id="addInfo"></spam>
          </p>
          <p class="modal-content-text">
            <strong>Sources:</strong> <a href="#" id="source1">click here🙃</a>
            <a href="#" id="source2">or here😉</a>
            <a href="#" id="source3">try this one sa well😎</a>
            <a href="#" id="source4">this is a trustfull source🥸</a>
            <a href="#" id="source5">dw,just click😏</a>
            <a href="#" id="source6">click😙</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
